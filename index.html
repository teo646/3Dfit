<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D fit</title>
<meta name="description" content="사진만으로 만든 3D 착용 뷰. 기존 상품 상세페이지에 그대로 붙여 고객이 직접 핏을 돌려보게 합니다.">
<meta name="theme-color" content="#0a0b0d">
<link rel="icon" href="./assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="preload" as="image" href="./assets/product/shot-1.png">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./shop.css">
</head>
<body>
<div class="page">
  <h1>
    <img class="mark" src="./assets/3dfit-logo.png" alt="" width="128" height="128">
    3D fit
  </h1>
  <p class="tagline">옷이 아닌 핏을 보여줍니다.</p>

  <div class="card stage-card">
    <div class="compare">
      <div class="switch" role="tablist" aria-label="상세페이지 비교" data-view="before">
        <span class="switch-thumb" aria-hidden="true"></span>
        <button type="button" role="tab" id="tab-before" aria-selected="true" aria-controls="stage" data-view="before">Before</button>
        <button type="button" role="tab" id="tab-after" aria-selected="false" aria-controls="stage" data-view="after" tabindex="-1">After</button>
      </div>
    </div>
    <section id="stage" data-view="before" aria-labelledby="product-name" role="tabpanel">
      <div class="shop-body">
        <header class="shop-header">
          <span class="shop-logo">EXAMPLE STORE</span>
          <nav class="shop-nav" aria-label="쇼핑몰 메뉴">
            <button type="button" aria-label="검색"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button>
            <button type="button" aria-label="전체 메뉴"><i class="ph ph-list" aria-hidden="true"></i></button>
            <button type="button" class="btn-header-cart" aria-label="장바구니"><i class="ph ph-shopping-bag" aria-hidden="true"></i></button>
          </nav>
        </header>
        <div class="shop-content">
        <div class="shop-grid">
          <div class="gallery" id="gallery">
            <figure class="main-shot" id="main-shot">
              <img id="main-img" src="./assets/product/shot-1.png" alt="맨투맨을 입고 의자에 앉은 모델의 정면 사진" width="1080" height="1440" fetchpriority="high">
              <div id="viewer-layer"></div>
              <canvas id="canvas" aria-label="맨투맨 착용 3D 뷰. 드래그해서 돌려볼 수 있습니다."></canvas>
            </figure>
          </div>

          <aside class="buybox" aria-label="구매 정보">
            <p class="crumbs">상의 &rsaquo; 맨투맨</p>
            <h2 id="product-name">워싱 맨투맨</h2>
            <p class="price"><span class="now">39,000원</span></p>
            <div class="options">
              <div class="opt-row">
                <span class="opt-label">색상</span>
                <span class="swatch">올리브 그레이</span>
              </div>
              <div class="opt-row">
                <span class="opt-label" id="size-label">사이즈</span>
                <div class="sizes" role="radiogroup" aria-labelledby="size-label">
                  <label><input type="radio" name="size" value="S"><span>S</span></label>
                  <label><input type="radio" name="size" value="M" checked><span>M</span></label>
                  <label><input type="radio" name="size" value="L"><span>L</span></label>
                  <label><input type="radio" name="size" value="XL"><span>XL</span></label>
                </div>
              </div>
            </div>
            <div class="actions">
              <button type="button" class="btn-cart">장바구니</button>
              <button type="button" class="btn-buy">구매하기</button>
            </div>
          </aside>
        </div>
        </div>

        <span class="wipe-line" id="wipe-line" aria-hidden="true"></span>
      </div>
    </section>
  </div>

  <div class="feature-cards">
    <div class="card feature-card">
      <p class="feature-card-title"><i class="ph ph-camera" aria-hidden="true"></i>사진만으로 생성</p>
      <p class="feature-card-desc">다양한 각도에서 촬영한 모델의 사진만으로 3차원 렌더링 결과물을 생성합니다.</p>
    </div>
    <div class="card feature-card">
      <p class="feature-card-title"><i class="ph ph-plugs-connected" aria-hidden="true"></i>간단한 웹사이트 연동</p>
      <p class="feature-card-desc">js코드 몇줄로 기존 웹사이트에 렌더러를 넣을 수 있습니다.</p>
    </div>
    <div class="card feature-card">
      <p class="feature-card-title"><i class="ph ph-check-circle" aria-hidden="true"></i>정확한 재현</p>
      <p class="feature-card-desc">생성형 모델이 아닙니다. Hallucination없이 의류를 정확하게 재현합니다.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://teo646.github.io/snap3d-viewer/dist/viewer.js"></script>
<script src="./app.js"></script>
</body>
</html>
