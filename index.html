<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap3d clothes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%237dd3c0' stroke-width='2.5'/%3E%3Ccircle cx='12.5' cy='12.5' r='2.6' fill='%237dd3c0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: 'Rubik', sans-serif;
    --font-mono: 'Roboto Mono', monospace;
    --text: rgba(0, 0, 0, 0.87);
    --text-2: rgba(0, 0, 0, 0.6);
    --accent: #ff5252;
    --border: rgba(0, 0, 0, 0.12);
    --bg: #ffffff;
    --page-margin-bg: #f5f5f5;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--page-margin-bg); color: var(--text);
    font: 18px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh; max-width: 960px; margin: 0 auto; padding: 40px 24px 24px;
    display: flex; flex-direction: column;
    background: var(--bg);
  }

  h1 {
    display: flex; align-items: center; gap: 12px; flex: none;
    font: 400 2.16rem/1.2 var(--font-sans); margin: 0;
  }
  h1 .mark { width: 32px; height: 32px; color: var(--accent); flex-shrink: 0; }
  h3.tagline { flex: none; font: 400 1.575rem/1.35 var(--font-sans); margin: 14px 0 24px; color: var(--text-2); font-weight: 400; }

  #stage {
    position: relative; flex: 1 1 auto; min-height: 240px;
    width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
    overflow: hidden;
  }
  #stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #stage.live #canvas { cursor: grab; }
  #stage.live #canvas.shs-dragging { cursor: grabbing; }
  #canvas:focus, #canvas:focus-visible { outline: none; }

  #progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: grid; justify-items: center; gap: 8px; padding: 20px 16px 16px;
    background: linear-gradient(transparent, rgba(255, 255, 255, 0.92));
    text-align: center; transition: opacity 0.3s ease;
  }
  #progress span { color: var(--text-2); font: 12px/1.4 var(--font-mono); }
  #bar { width: 220px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s linear; }
  #progress.failed span { color: #d32f2f; }
  #progress.failed #bar { display: none; }

  .footer-points {
    flex: none; list-style: none; margin: 16px 0 0; padding: 0;
    color: var(--text-2); font: 15px/1.7 var(--font-sans);
  }
  .footer-points li { position: relative; padding-left: 16px; }
  .footer-points li::before { content: '–'; position: absolute; left: 0; }
</style>
</head>
<body>
<div class="page">
  <h1>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
    </svg>
    snap3d
  </h1>
  <h3 class="tagline">옷이 아닌 핏을 보여줍니다</h3>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="progress"><div id="bar"><i></i></div><span id="status">starting…</span></div>
  </div>

  <ul class="footer-points">
    <li>사진만으로 생성</li>
    <li>간단한 기존 웹사이트 연동</li>
  </ul>
</div>

<script src="https://teo646.github.io/snap3d-viewer/dist/viewer.js"></script>
<script src="./app.js"></script>
</body>
</html>
